services:
  mysql:
    image: 'mysql:8.4'
    container_name: meetspace-mysql
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
